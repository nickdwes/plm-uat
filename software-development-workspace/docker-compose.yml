services:

  db:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hrms-db:/var/lib/postgresql/data
    networks:
      - hrms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_user -d hrms"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend-laravel
      dockerfile: Dockerfile
    container_name: hrms-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://hrms-be.bitwyse.co.ke
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: hrms
      DB_USERNAME: hrms_user
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      SANCTUM_STATEFUL_DOMAINS: "hrms.bitwyse.co.ke,localhost,localhost:3000"
      FRONTEND_URL: https://hrms.bitwyse.co.ke
      CORS_ALLOWED_ORIGINS: "https://hrms.bitwyse.co.ke,https://vacancy.bitwyse.co.ke,https://vacancy.bitwyse.com,http://localhost:3000,http://localhost:5173,http://localhost:8080"
    volumes:
      - hrms-storage:/var/www/html/storage/app/public
      - hrms-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/api/public/jobs > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "9090:80"
    networks:
      - hrms

  frontend:
    build:
      context: ./apps/web-laravel
      dockerfile: Dockerfile
    container_name: hrms-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hrms

  job-portal:
    image: nginx:alpine
    container_name: hrms-job-portal
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./apps/job-portal/dist:/usr/share/nginx/html:ro
      - ./apps/job-portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hrms

networks:
  hrms:
    driver: bridge

volumes:
  hrms-db:
    name: hrms-postgres-data
  hrms-storage:
    name: hrms-laravel-storage
  hrms-logs:
    name: hrms-laravel-logs
