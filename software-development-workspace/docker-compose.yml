services:

  db:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hrms-db:/var/lib/postgresql/data
    networks:
      - hrms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_user -d hrms"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend-laravel
      dockerfile: Dockerfile
    container_name: hrms-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://hrms-be.bitwyse.co.ke
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: hrms
      DB_USERNAME: hrms_user
      DB_PASSWORD: ${DB_PASSWORD}
      # Documents are encrypted before they reach storage. Without this the
      # application refuses to store or read one — see docs/security-runbook.md.
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      SESSION_DRIVER: file
      CACHE_STORE: file
      SANCTUM_STATEFUL_DOMAINS: "hrms.bitwyse.co.ke,localhost,localhost:3000"
      FRONTEND_URL: https://hrms.bitwyse.co.ke
      MAIL_MAILER: graph
      MAIL_FROM_ADDRESS: "hrms@kns.co.ke"
      MAIL_FROM_NAME: "HR Portal"
      MICROSOFT_TENANT_ID: "fe3cf4ea-a68e-4f54-b968-50e80b84f4a7"
      MICROSOFT_CLIENT_ID: "9b75caba-59a6-4b2a-b700-59ae3c7bc824"
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      AZURE_REDIRECT_URI: "https://hrms-be.bitwyse.co.ke/api/auth/azure/callback"
      # Blob storage for documents. The client credentials are read by
      # DefaultAzureCredential; on an Azure host they are omitted entirely and
      # managed identity answers instead, leaving no secret to rotate.
      DOCUMENT_DISK: ${DOCUMENT_DISK:-local}
      BACKUP_ALERT_EMAIL: ${BACKUP_ALERT_EMAIL}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      # Read-only inventory sync — its own registration, so the secret that can
      # read the directory is not the one holding employee documents.
      MS_INVENTORY_TENANT_ID: ${MS_INVENTORY_TENANT_ID}
      MS_INVENTORY_CLIENT_ID: ${MS_INVENTORY_CLIENT_ID}
      MS_INVENTORY_CLIENT_SECRET: ${MS_INVENTORY_CLIENT_SECRET}
      MS_INVENTORY_SUBSCRIPTION_ID: ${MS_INVENTORY_SUBSCRIPTION_ID}
      CORS_ALLOWED_ORIGINS: "https://hrms.bitwyse.co.ke,https://vacancy.bitwyse.co.ke,https://vacancy.bitwyse.com,http://localhost:3000,http://localhost:5173,http://localhost:8080"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Requested-With,X-HRMS-Version,X-Organization"
    volumes:
      - hrms-storage:/var/www/html/storage/app/public
      # Private storage — résumés, preboarding documents. Not reachable over
      # HTTP, and needs its own volume: without one it lives in the container
      # filesystem and is destroyed by the next rebuild.
      - hrms-private:/var/www/html/storage/app/private
      # Database backups, bind-mounted to the host on purpose. A dump living
      # in the container filesystem is destroyed by the rebuild you are most
      # likely to be doing when you need it, and a named volume is invisible
      # to anybody looking for a file to copy off the machine.
      - ./backups:/var/www/html/backups
      - hrms-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/api/public/jobs > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "9090:80"
    networks:
      - hrms


  frontend:
    build:
      context: ./apps/web-laravel
      dockerfile: Dockerfile
      args:
        VITE_LARAVEL_API_URL: https://hrms-be.bitwyse.co.ke
    container_name: hrms-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hrms

  job-portal:
    image: nginx:alpine
    container_name: hrms-job-portal
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./apps/job-portal/dist:/usr/share/nginx/html:ro
      - ./apps/job-portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hrms

networks:
  hrms:
    driver: bridge

volumes:
  hrms-db:
    name: hrms-postgres-data
  hrms-storage:
    name: hrms-laravel-storage
  hrms-private:
    name: hrms-laravel-private
  hrms-logs:
    name: hrms-laravel-logs
