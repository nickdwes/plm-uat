[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/php-fpm.err.log
stdout_logfile=/var/log/supervisor/php-fpm.out.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/supervisor/queue-worker.out.log
stderr_logfile=/var/log/supervisor/queue-worker.err.log
stopwaitsecs=30

# ── The scheduler ─────────────────────────────────────────────────────────────
#
# Nothing was running Laravel's scheduler. The tasks were registered and due —
# the SLA escalation ladder every fifteen minutes, the support automation rules
# hourly, the nightly backup — and not one had ever fired, because the image has
# no cron and nothing invoked `schedule:run`. A schedule nobody runs looks
# exactly like one that works, right up until somebody checks.
#
# Supervised alongside the queue worker rather than left to cron, so it is
# restarted if it dies and its output lands somewhere with the rest.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/supervisor/scheduler.out.log
stderr_logfile=/var/log/supervisor/scheduler.err.log
stopwaitsecs=60
