# Security headers, kept in one file and included everywhere they are needed.
#
# nginx does NOT merge `add_header` across levels: the moment a `location` adds
# a header of its own (e.g. Cache-Control), it drops every header inherited from
# the server block. So each location that sets any header must `include` this
# too, or the security headers silently vanish on exactly the responses that
# matter most — the SPA's index.html and its assets.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://hrms-be.bitwyse.co.ke; connect-src 'self' https://hrms-be.bitwyse.co.ke; frame-ancestors 'self';" always;
