server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;

    # Server-level default. Inherited by any location that adds no header of its
    # own; locations that DO add one must re-include the snippet (see below).
    include /etc/nginx/security-headers.conf;

    # Block common attacker/bot probe paths — return 404 before the SPA fallback
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(env|git|sql|bak|backup|sh|key|pem|log|ini|conf|yml|yaml|json|lock|orig|swp|DS_Store)$ {
        deny all;
        return 404;
    }
    location ~* /(backup|dump|db|database|config|credentials|secret|private)(\..*)?$ {
        deny all;
        return 404;
    }

    # Vue Router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Cache static assets aggressively (Vite fingerprints filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the SPA entry point
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Healthcheck
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxy /api and /storage to the Laravel backend (fallback for local dev / direct container access)
    location ~ ^/(api|storage) {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
