server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;

    # Block common attacker/bot probe paths — return 404 before the SPA fallback
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(env|git|sql|bak|backup|sh|key|pem|log|ini|conf|yml|yaml|json|lock|orig|swp|DS_Store)$ {
        deny all;
        return 404;
    }
    location ~* /(backup|dump|db|database|config|credentials|secret|private)(\..*)?$ {
        deny all;
        return 404;
    }

    # Vue Router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Proxy /api, /sanctum, /login, /logout, /storage to the Laravel backend
    location ~ ^/(api|storage) {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
